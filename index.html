<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandboxed Comments</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="comments"></div>

  <template id="comment-template">
    <div class="comment-container">
      <div class="comment-header">
        <img class="avatar">
        <a class="username" target="_blank"></a>
        <span class="timestamp"></span>
        <span class="pinned-badge" style="display:none">PINNED</span>
      </div>
      <iframe sandbox="allow-scripts" class="comment-iframe" scrolling="no"></iframe>
      <div class="comment-metadata">
        <div class="reply-count"></div>
        <div class="reaction-list"></div>
      </div>
    </div>
  </template>

  <template id="replies-template">
    <div class="replies-container">
      <div class="loading-replies">Loading replies...</div>
    </div>
  </template>

  <script src="emoji.js"></script>
  <script src="commentRendering.js"></script>
  <script src="commentSync.js"></script>
  <script src="commentCore.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
