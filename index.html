<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sandboxed Comments</title>
  <style>
    .comment-container {
      margin: 20px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .comment-iframe {
      width: 100%;
      border: none;
      background: transparent;
    }

    .comment-header {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      margin-right: 10px;
    }

    .username {
      font-weight: bold;
      color: #333;
      text-decoration: none;
    }

    .timestamp {
      color: #666;
      margin-left: 10px;
      font-size: 0.9em;
    }

    .comment-metadata {
      color: #666;
      font-size: 0.9em;
      margin: 10px 0;
    }

    .reaction-list {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .reaction {
      background: #f0f0f0;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.9em;
    }

    .reply-count {
      color: #0066cc;
      cursor: pointer;
      margin-top: 8px;
    }

    .pinned-badge {
      background: #ffd700;
      color: #000;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.8em;
      margin-left: 10px;
    }

    /* Add animation styles */
    .comment-container {
      transition: all 0.5s ease-out;
      opacity: 1;
      transform: translateY(0);
    }

    .comment-container.new-comment {
      opacity: 0;
      transform: translateY(-20px);
    }

    #comments {
      position: relative;
    }
  </style>
</head>
<body>
  <div id="comments"></div>

  <template id="comment-template">
    <div class="comment-container">
      <div class="comment-header">
        <img class="avatar">
        <a class="username" target="_blank"></a>
        <span class="timestamp"></span>
        <span class="pinned-badge" style="display:none">PINNED</span>
      </div>
      <div class="comment-metadata">
        <div class="reaction-list"></div>
        <div class="reply-count"></div>
      </div>
      <iframe sandbox="allow-scripts" class="comment-iframe" scrolling="no"></iframe>
    </div>
  </template>

  <script>
    // Initialize WebsimSocket for database access
    const room = new WebsimSocket();
    
    const REFRESH_INTERVAL = 30000; // Check for new comments every 30 seconds
    let lastCommentTimestamp = null;
    let projectId = null;
    let currentUser = null;

    // Add emoji mapping object
    const emojiMap = {
      '+1': '👍',
      '-1': '👎',
      'thumbsup': '👍',
      'thumbsdown': '👎',
      'heart': '❤️',
      'smile': '😊',
      'laugh': '😄',
      'tada': '🎉',
      'rocket': '🚀',
      'fire': '🔥',
      'clap': '👏',
      'eyes': '👀',
      'thinking': '🤔',
      'raised_hands': '🙌',
      'pray': '🙏',
      'party': '🎉',
      'star': '⭐',
      'sparkles': '✨',
      'heart_eyes': '😍',
      'sunglasses': '😎',
      'rage': '😡',
      'cry': '😢',
      'scream': '😱',
      'zzz': '💤',
      'muscle': '💪',
      'ok_hand': '👌',
      'v': '✌️',
      'point_up': '☝️',
      'wave': '👋',
      'smiley': '😃',
      'joy': '😂',
      'skull': '💀',
      'unicorn': '🦄',
      'rainbow': '🌈',
      'bulb': '💡',
      'bell': '🔔',
      'crown': '👑',
      'gift': '🎁',
      'trophy': '🏆'
    };

    // Add emoji conversion function 
    function getEmoji(name) {
      return emojiMap[name.toLowerCase()] || name;
    }

    async function getCurrentUser() {
      if (!currentUser) {
        currentUser = await window.websim.getUser();
      }
      return currentUser;
    }

    async function formatTimestamp(timestamp) {
      const date = new Date(timestamp);
      const now = new Date();
      const diff = now - date;
      
      if (diff < 60000) return 'just now';
      if (diff < 3600000) return `${Math.floor(diff/60000)}m ago`;
      if (diff < 86400000) return `${Math.floor(diff/3600000)}h ago`;
      if (diff < 604800000) return `${Math.floor(diff/86400000)}d ago`;
      
      return date.toLocaleDateString();
    }

    function renderReactions(reactions, container) {
      container.innerHTML = reactions.map(reaction => `
        <span class="reaction">
          ${getEmoji(reaction.emoji.name)} ${reaction.count}
        </span>
      `).join('');
    }

    async function getLLMResponse(comment) {
      try {
        const completion = await websim.chat.completions.create({
          messages: [
            {
              role: "system",
              content: `You are a creative web designer. Convert the user's request into a web component design.
              Respond with JSON in this exact format:
              {
                "html": "the HTML markup for the component",
                "css": "the CSS styles needed",
                "js": "any JavaScript required (if needed)",
                "description": "brief description of what you created"
              }
              Keep the design simple, elegant, and self-contained. Use inline SVG instead of images.
              Ensure all CSS class names are prefixed with a unique identifier to avoid conflicts.`
            },
            {
              role: "user",
              content: comment.raw_content
            }
          ],
          json: true
        });

        // Parse and validate the response
        const response = JSON.parse(completion.content);
        return response;
      } catch (err) {
        console.error('Error getting LLM response:', err);
        return null;
      }
    }

    async function syncCommentToDatabase(comment) {
      try {
        // First get ALL existing comments from database
        const existingComments = await room.collection('comments').getList();
        
        // Check if this comment already exists
        const commentExists = existingComments.some(dbComment => 
          dbComment.comment_id === comment.id
        );

        if (commentExists) {
          console.log('Comment already exists in database, skipping sync:', comment.id);
          return;
        }

        // Get LLM response before database insertion
        const llmResponse = await getLLMResponse(comment);

        // Create a record in our database with comment data
        await room.collection('comments').create({
          comment_id: comment.id,
          project_id: comment.project_id,
          content: comment.raw_content,
          parent_comment_id: comment.parent_comment_id,
          pinned: comment.pinned,
          pinned_by: comment.pinned_by?.username,
          reactions: JSON.stringify(comment.reactions),
          reply_count: comment.reply_count,
          created_at: comment.created_at,
          // Add the LLM response data
          llm_response: llmResponse ? JSON.stringify(llmResponse) : null
        });
        
        console.log('Successfully synced comment to database:', comment.id);
      } catch (err) {
        console.error('Error syncing comment to database:', err);
      }
    }

    async function renderComment(comment, template, commentsDiv, index, iframeMap) {
      const container = template.content.cloneNode(true);
      
      const avatar = container.querySelector('.avatar');
      const username = container.querySelector('.username');
      const timestamp = container.querySelector('.timestamp');
      const pinnedBadge = container.querySelector('.pinned-badge');
      const reactionList = container.querySelector('.reaction-list');
      const replyCount = container.querySelector('.reply-count');
      const iframe = container.querySelector('iframe');

      iframeMap.set(index, iframe);

      // Set up header info
      avatar.src = `https://images.websim.ai/avatar/${comment.author.username}`;
      username.href = `https://websim.ai/@${comment.author.username}`;
      username.textContent = '@' + comment.author.username;
      timestamp.textContent = await formatTimestamp(comment.created_at);

      // Show pinned status
      if (comment.pinned) {
        pinnedBadge.style.display = 'inline';
        if (comment.pinned_by) {
          pinnedBadge.title = `Pinned by @${comment.pinned_by.username}`;
        }
      }

      // Show reactions
      renderReactions(comment.reactions, reactionList);

      // Show reply count
      if (comment.reply_count > 0) {
        replyCount.textContent = `${comment.reply_count} ${comment.reply_count === 1 ? 'reply' : 'replies'}`;
      }

      // Create sandboxed comment content
      let llmContent = '';
      
      // Check if we have an LLM response in our database
      const dbComment = (await room.collection('comments').filter({ comment_id: comment.id }).getList())[0];
      
      if (dbComment?.llm_response) {
        try {
          const llmResponse = JSON.parse(dbComment.llm_response);
          llmContent = `
            <div class="llm-response">
              <style>${llmResponse.css}</style>
              ${llmResponse.html}
              <script>${llmResponse.js}<\/script>
            </div>
          `;
        } catch (err) {
          console.error('Error parsing LLM response:', err);
        }
      }

      const html = `<!DOCTYPE html>
        <html>
        <head>
          <meta charset="UTF-8">
          <style>
            body { 
              margin: 0;
              font-family: system-ui, sans-serif;
              line-height: 1.5;
            }
            p { margin: 0 0 1em; }
            a { color: #0066cc; }
            img { max-width: 100%; height: auto; }
            .llm-response {
              margin-top: 20px;
              padding: 15px;
              border: 1px solid #eee;
              border-radius: 8px;
            }
          </style>
        </head>
        <body>
          <div class="user-content">${comment.raw_content || ''}</div>
          ${llmContent}
          <script>
            window.addEventListener('load', () => {
              const height = document.body.scrollHeight;
              window.parent.postMessage({
                type: 'resize', 
                height,
                index: ${index}
              }, '*');
            });
          <\/script>
        </body>
        </html>`;

      const blob = new Blob([html], {type: 'text/html'});
      const blobUrl = URL.createObjectURL(blob);
      iframe.src = blobUrl;
      
      return {container, blobUrl};
    }

    async function loadAndSyncComments(checkNewOnly = false) {
      if (!projectId) {
        projectId = (await window.websim.getCurrentProject()).id;
      }

      const user = await getCurrentUser();
      
      // Get all comments from API
      const response = await fetch(`/api/v1/projects/${projectId}/comments`);
      const data = await response.json();
      
      if (data.comments.data.length === 0) return;

      // Get ALL comments from our database
      const dbComments = await room.collection('comments').getList();
      
      // Create a map for faster lookups
      const existingCommentMap = new Map(
        dbComments.map(comment => [comment.comment_id, comment])
      );

      // Check each API comment and sync if needed
      const syncPromises = data.comments.data.map(async ({comment}) => {
        if (!existingCommentMap.has(comment.id) && comment.author.username === user.username) {
          await syncCommentToDatabase(comment);
        }
      });

      // Wait for all sync operations to complete
      await Promise.all(syncPromises);

      const latestTimestamp = new Date(data.comments.data[0].comment.created_at);
      
      if (checkNewOnly && (!lastCommentTimestamp || latestTimestamp <= lastCommentTimestamp)) {
        return;
      }
      
      if (!checkNewOnly) {
        document.getElementById('comments').innerHTML = '';
      }

      const commentsDiv = document.getElementById('comments');
      const template = document.getElementById('comment-template');
      const iframeMap = new Map();
      const blobUrls = [];

      // Render new comments
      for (const [index, {comment}] of data.comments.data.entries()) {
        if (checkNewOnly && lastCommentTimestamp && new Date(comment.created_at) <= lastCommentTimestamp) {
          continue;
        }

        const {container, blobUrl} = await renderComment(comment, template, commentsDiv, index, iframeMap);
        blobUrls.push(blobUrl);
        
        if (checkNewOnly) {
          const firstChild = container.firstElementChild;
          firstChild.classList.add('new-comment');
          commentsDiv.insertBefore(container, commentsDiv.firstChild);
          
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              firstChild.classList.remove('new-comment');
            });
          });
        } else {
          commentsDiv.appendChild(container);
        }
      }

      lastCommentTimestamp = latestTimestamp;

      // Listen for iframe resize messages
      window.addEventListener('message', (e) => {
        if (e.data?.type === 'resize') {
          const iframe = iframeMap.get(e.data.index);
          if (iframe) {
            iframe.style.height = e.data.height + 'px';
          }
        }
      });

      // Clean up blob URLs when navigating away
      window.addEventListener('unload', () => {
        blobUrls.forEach(URL.revokeObjectURL);
      });
    }

    // Initial load
    loadAndSyncComments();

    // Set up periodic checking for new comments
    setInterval(() => {
      loadAndSyncComments(true);
    }, REFRESH_INTERVAL);

    // Subscribe to database changes
    room.collection('comments').subscribe(function(comments) {
      console.log('Database comments updated:', comments);
    });
  </script>

</body>
